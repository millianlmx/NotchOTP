# Pushing a tag `vX.Y` archives the app, exports the Mac App Store package and uploads it to
# App Store Connect. The version is the tag, the build number the run number. Nothing is
# published on GitHub: the store is the only distribution channel.
#
# Secrets (Settings → Secrets and variables → Actions) — see docs/app-store.md:
#   APPLE_TEAM_ID                  the developer team identifier
#   APPLE_CERTIFICATES_P12         base64 of a .p12 holding Apple Development, Apple
#                                  Distribution and Mac Installer Distribution, with keys
#   APPLE_CERTIFICATES_PASSWORD    the .p12 password
#   ASC_KEY_ID, ASC_ISSUER_ID      an App Store Connect API key (App Manager role)
#   ASC_API_KEY_P8                 the content of its AuthKey_*.p8 file
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.1); defaults to the pushed tag"
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  app-store:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Secrets are materialised under the runner's temp directory, outside the workspace.
      - name: Choose where the signing material lives
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import signing certificates
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
        run: |
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificates.p12"
          # Let codesign and productbuild use the keys without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v "$KEYCHAIN"

      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_API_KEY_P8" > "$ASC_KEY_PATH"

      - name: Archive, export and upload
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          export VERSION
          echo "Version $VERSION ($BUILD_NUMBER)"
          Scripts/archive-app.sh --upload

      # The archive, for a rejected build to be reproduced: it is the same Release
      # configuration, and unlike the store-signed payload it can be launched locally.
      - name: Keep the archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NotchOTP-${{ github.run_number }}.xcarchive
          path: build/NotchOTP.xcarchive
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$ASC_KEY_PATH"
