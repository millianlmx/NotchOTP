# Every push to main that carries a releasable commit — feat, fix, perf, or a breaking
# change, in the Conventional Commits sense — becomes a release: Scripts/next-release.sh
# picks the version, the tag and the GitHub release (with the notes) are created, then the
# app is archived, exported and uploaded to App Store Connect under that version. A push of
# docs, tests or CI alone releases nothing.
#
# The build number is the commit count on main — App Store Connect wants it strictly higher
# than the last upload, whatever the version. Nothing but the notes is published on GitHub:
# the store is the only distribution channel.
#
# Secrets (Settings → Secrets and variables → Actions) — see docs/app-store.md:
#   APPLE_TEAM_ID                  the developer team identifier
#   APPLE_CERTIFICATES_P12         base64 of a .p12 holding Apple Development, Apple
#                                  Distribution and Mac Installer Distribution, with keys
#   APPLE_CERTIFICATES_PASSWORD    the .p12 password
#   ASC_KEY_ID, ASC_ISSUER_ID      an App Store Connect API key (App Manager role)
#   ASC_API_KEY_P8                 the content of its AuthKey_*.p8 file
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Force this version (e.g. 1.2) instead of deriving it from the commits"
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      build: ${{ steps.next.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide the version
        id: next
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="$(Scripts/next-release.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -z "$version" ]]; then
            echo "Nothing to release since $(git describe --tags --abbrev=0 --match 'v*')."
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already exists"
            exit 1
          else
            echo "Releasing $version"
          fi

      - name: Tag and publish the release notes
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          Scripts/next-release.sh --notes > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "NotchOTP $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  app-store:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Secrets are materialised under the runner's temp directory, outside the workspace.
      - name: Choose where the signing material lives
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import signing certificates
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
        run: |
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificates.p12"
          # Let codesign and productbuild use the keys without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v "$KEYCHAIN"

      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_API_KEY_P8" > "$ASC_KEY_PATH"

      - name: Archive, export and upload
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build }}
        run: |
          echo "Version $VERSION ($BUILD_NUMBER)"
          Scripts/archive-app.sh --upload

      # The archive, for a rejected build to be reproduced: it is the same Release
      # configuration, and unlike the store-signed payload it can be launched locally.
      - name: Keep the archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NotchOTP-${{ needs.version.outputs.version }}-${{ needs.version.outputs.build }}.xcarchive
          path: build/NotchOTP.xcarchive
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$ASC_KEY_PATH"
